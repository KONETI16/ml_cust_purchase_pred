name: Production CI/CD Pipeline

# 1. Define when this automation triggers
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your code repository onto the runner machine
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # Step 2: Establish an isolated Docker Buildx instance
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 3: Securely authenticate into Docker Hub using secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Set up Python for DVC
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install DVC
      run: |
        python -m pip install --upgrade pip
        pip install dvc

    - name: Show DVC config and remotes
      run: |
        echo "--- .dvc/config (if present) ---"
        if [ -f .dvc/config ]; then cat .dvc/config; else echo "No .dvc/config file found"; fi
        echo "--- dvc remote list ---"
        dvc remote list || true

    - name: Pull DVC Data (guarded)
      run: |
        # Detect common local-path remotes and skip in CI with explanatory message.
        if [ -f .dvc/config ] && grep -q "UsersprakaDocumentsProjectsdvc_remote_storage" .dvc/config; then
          echo "DVC remote appears to be a local path that is not accessible from GitHub Actions."
          echo "Configure a cloud remote (s3/gcs/azure) and add credentials as secrets, or commit required runtime artifacts."
          echo "Skipping dvc pull to allow image build. To fail instead, update the workflow."
          exit 0
        fi
        dvc pull

    # Step 4: Automate container building and image pushing
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Image tags: use your Docker Hub username stored in the secret
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/customer-api:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/customer-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
