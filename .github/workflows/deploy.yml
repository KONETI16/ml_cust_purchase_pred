name: Production CI/CD Pipeline

# 1. Define when this automation triggers
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your code repository onto the runner machine
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # Step 2: Establish an isolated Docker Buildx instance
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 3: Securely authenticate into Docker Hub using secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # Step 4: Automate container building and image pushing
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Image tags: use your Docker Hub username stored in the secret
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/customer-api:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/customer-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
